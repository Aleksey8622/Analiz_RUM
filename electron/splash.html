<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DELEKTO Analysis Room</title>
    <style>
      :root { color-scheme: light; font-family: Inter, "Segoe UI", Arial, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        background: #fff;
        color: #202a35;
        user-select: none;
      }
      main { display: grid; justify-items: center; gap: 28px; }
      img { width: 116px; height: 116px; object-fit: contain; }
      .word { display: flex; gap: 7px; font-size: 28px; font-weight: 800; letter-spacing: .08em; }
      .word span { animation: pulse 1.4s ease-in-out infinite; color: #c8cdd2; }
      .word span:nth-child(2) { animation-delay: .12s; }
      .word span:nth-child(3) { animation-delay: .24s; }
      .word span:nth-child(4) { animation-delay: .36s; }
      .word span:nth-child(5) { animation-delay: .48s; }
      .word span:nth-child(6) { animation-delay: .60s; }
      .word span:nth-child(7) { animation-delay: .72s; }
      .caption { margin-top: -14px; color: #8a929a; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
      @keyframes pulse {
        0%, 45%, 100% { color: #c8cdd2; transform: translateY(0); }
        18% { color: #ff4023; transform: translateY(-3px); }
      }
      @media (prefers-reduced-motion: reduce) { .word span { animation: none; color: #ff4023; } }
    </style>
  </head>
  <body>
    <main aria-label="Загрузка DELEKTO Analysis Room">
      <img src="../assets/delekto-kitchen-icon.png" alt="Дилекто кухня" />
      <div class="word" aria-label="DELEKTO">
        <span>D</span><span>E</span><span>L</span><span>E</span><span>K</span><span>T</span><span>O</span>
      </div>
      <div class="caption">Analysis Room</div>
    </main>
  </body>
</html>
