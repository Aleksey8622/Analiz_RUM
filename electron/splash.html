<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DELEKTO Analysis Room</title>
    <style>
      :root { color-scheme: light; font-family: Inter, "Segoe UI", Arial, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        background: #ff4023;
        color: #fff;
        user-select: none;
      }
      main { display: grid; justify-items: center; gap: 24px; }
      .word { display: flex; gap: 10px; font-size: 52px; font-weight: 800; letter-spacing: .08em; }
      .word span { animation: pulse 1.75s ease-in-out infinite; color: rgba(255, 255, 255, .38); }
      .word span:nth-child(2) { animation-delay: .15s; }
      .word span:nth-child(3) { animation-delay: .30s; }
      .word span:nth-child(4) { animation-delay: .45s; }
      .word span:nth-child(5) { animation-delay: .60s; }
      .word span:nth-child(6) { animation-delay: .75s; }
      .word span:nth-child(7) { animation-delay: .90s; }
      .caption { color: rgba(255, 255, 255, .78); font-size: 13px; letter-spacing: .22em; text-transform: uppercase; }
      @keyframes pulse {
        0%, 42%, 100% { color: rgba(255, 255, 255, .38); transform: translateY(0) scale(1); }
        16% { color: #fff; transform: translateY(-12px) scale(1.08); text-shadow: 0 9px 22px rgba(132, 20, 0, .26); }
      }
      @media (prefers-reduced-motion: reduce) { .word span { animation: none; color: #fff; } }
    </style>
  </head>
  <body>
    <main aria-label="Загрузка DELEKTO Analysis Room">
      <div class="word" aria-label="DELEKTO">
        <span>D</span><span>E</span><span>L</span><span>E</span><span>K</span><span>T</span><span>O</span>
      </div>
      <div class="caption">Analysis Room</div>
    </main>
  </body>
</html>
